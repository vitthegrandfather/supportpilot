name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: supportpilot
          POSTGRES_PASSWORD: supportpilot
          POSTGRES_DB: supportpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportpilot -d supportpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Alembic migrations
        env:
          DATABASE_URL: postgresql+asyncpg://supportpilot:supportpilot@localhost:5432/supportpilot_test
        run: python -m alembic upgrade head
      - name: pytest
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          CELERY_TASK_ALWAYS_EAGER: "true"
          SECRET_KEY: ci-not-a-real-secret
        run: python -m pytest -q
      - run: python -m ruff check app tests
      - run: python -m ruff format --check app tests
      - run: python -m mypy app
